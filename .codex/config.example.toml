[shell_environment_policy]
inherit = "core"

[shell_environment_policy.set]
PATH_TO_REPO = 'C:\path\to\legacy-upgrade-system\projects\target-repo'

[mcp_servers.gitnexus]
command = "npx"
args = [
    "-y",
    "gitnexus",
    "mcp",
]

[mcp_servers.gitnexus.env]
PATH_TO_REPO = 'C:\path\to\legacy-upgrade-system\projects\target-repo'

[mcp_servers.mem0]
url = "https://mcp.mem0.ai/mcp/"

[mcp_servers.mem0.http_headers]
Authorization = "Token your_mem0_token_here"
